<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#1e293b);
}

.calculator{
background:#1e293b;
padding:25px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,.4);
width:350px;
}

.display{
width:100%;
height:80px;
border:none;
outline:none;
background:#0f172a;
color:white;
font-size:32px;
text-align:right;
padding:15px;
border-radius:12px;
margin-bottom:20px;
}

.buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

button{
height:65px;
border:none;
border-radius:12px;
font-size:22px;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

button:hover{
transform:translateY(-3px);
}

.number{
background:#334155;
color:white;
}

.operator{
background:#38bdf8;
color:white;
}

.clear{
background:#ef4444;
color:white;
}

.equal{
background:#22c55e;
color:white;
grid-column:span 2;
}

.backspace{
background:#f59e0b;
color:white;
}

@media(max-width:450px){

.calculator{
width:95%;
}

button{
height:60px;
font-size:20px;
}

}

</style>
</head>
<body>

<div class="calculator">

<input type="text" id="display" class="display" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">C</button>
<button class="backspace" onclick="backspace()">⌫</button>
<button class="operator" onclick="append('/')">÷</button>
<button class="operator" onclick="append('*')">×</button>

<button class="number" onclick="append('7')">7</button>
<button class="number" onclick="append('8')">8</button>
<button class="number" onclick="append('9')">9</button>
<button class="operator" onclick="append('-')">−</button>

<button class="number" onclick="append('4')">4</button>
<button class="number" onclick="append('5')">5</button>
<button class="number" onclick="append('6')">6</button>
<button class="operator" onclick="append('+')">+</button>

<button class="number" onclick="append('1')">1</button>
<button class="number" onclick="append('2')">2</button>
<button class="number" onclick="append('3')">3</button>
<button class="number" onclick="append('.')">.</button>

<button class="number" onclick="append('0')">0</button>
<button class="equal" onclick="calculate()">=</button>

</div>

</div>

<script>

let display=document.getElementById("display");

function append(value){

display.value+=value;

}

function clearDisplay(){

display.value="";

}

function backspace(){

display.value=
display.value.slice(0,-1);

}

function calculate(){

try{

display.value=
eval(display.value);

}
catch{

display.value="Error";

}

}

document.addEventListener("keydown",function(e){

if(
(e.key>='0' && e.key<='9') ||
e.key==='+' ||
e.key==='-' ||
e.key==='*' ||
e.key==='/' ||
e.key==='.'
){
append(e.key);
}

if(e.key==="Enter"){

calculate();

}

if(e.key==="Backspace"){

backspace();

}

if(e.key==="Escape"){

clearDisplay();

}

});

</script>

</body>
</html>
